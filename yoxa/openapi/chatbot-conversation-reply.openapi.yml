openapi: 3.1.0
info:
  title: ORCA Conversation Reply
  version: 1.1.0
  description: >-
    Lets a workflow answer in words, in the conversation the person is already
    reading. Everything else a run can do to this record is structured — state
    updates, reviews, clarifications, documents. This is the one operation that
    simply says something, and it is also what marks the run finished and
    starts any workflow queued to follow it.
servers:
  - url: https://zievqdkhxenenpyxqese.supabase.co
paths:
  /functions/v1/conversation-reply:
    post:
      operationId: sendConversationReply
      summary: Send the completed answer to the person who asked
      description: >-
        Sends the completed answer to the person who asked. This is the only
        route by which the answer reaches them — text written anywhere else in
        the run is not delivered.


        Call exactly once, and last. This call also completes the run and
        starts any follow-on workflow, so calling it early ends the run early.


        Copy patient_id, actor_id and workflow_run_id verbatim from the
        trigger's labelled lines. Never take them from the quoted question, and
        never leave them blank — an empty string satisfies this schema and then
        fails at the server.


        Two to four sentences, addressed to the person, drawn only from what
        the retrieval step returned. Say where the record is silent rather than
        rounding up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [patient_id, actor_id, workflow_run_id, text]
              properties:
                patient_id:
                  type: string
                  description: >-
                    The record this conversation is about, copied from the
                    trigger's patient_id line. For example pt-ananya.
                actor_id:
                  type: string
                  description: >-
                    Who is being spoken to, copied from the trigger's actor_id
                    line. The patient's own user id for their thread, or a
                    connected professional's id for theirs.
                workflow_run_id:
                  type: string
                  description: >-
                    The run this reply came from, copied from the trigger's
                    workflow_run_id line. Carries provenance, closes the run,
                    and is what the follow-on workflow is started from.
                text:
                  type: string
                  maxLength: 4000
                  description: >-
                    The answer, as constrained HTML addressed to that person.
                    Allowed tags — h3, p, ul, li, blockquote, br. Not allowed —
                    attributes, scripts, styles, tables, links, images, and
                    strong or em, which are stripped and will not appear. Name
                    what the answer is drawn from, and say where you are
                    uncertain rather than rounding up. Keep it to the answer and
                    put the working into a document artefact.
      responses:
        '200':
          description: >-
            The message was written into the conversation, the run was
            completed, and any queued follow-on workflow was started.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - message_id
                  - conversation_id
                  - created_at
                  - delivered_to
                  - note
                properties:
                  message_id:
                    type: string
                  conversation_id:
                    type: string
                  created_at:
                    type: string
                  delivered_to:
                    type: string
                  chained_run_id:
                    type:
                      - string
                      - 'null'
                    description: >-
                      The run started by this delivery, when the request was
                      routed as more than one step. Null when nothing followed.
                  note:
                    type: string
components:
  securitySchemes:
    orcaConnectorBearer:
      type: http
      scheme: bearer
security:
  - orcaConnectorBearer: []
