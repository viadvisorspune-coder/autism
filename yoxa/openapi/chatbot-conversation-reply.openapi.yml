openapi: 3.1.0
info:
  title: ORCA Conversation Reply
  version: 1.2.0
  description: >-
    Lets a workflow answer in words, in the conversation the person is already
    reading. Everything else a run can do to this record is structured — state
    updates, reviews, clarifications, documents. This is the one operation that
    simply says something, and it is also what marks the run finished and
    starts any workflow queued to follow it.
servers:
  - url: https://zievqdkhxenenpyxqese.supabase.co
paths:
  /functions/v1/conversation-reply:
    post:
      operationId: sendConversationReply
      summary: Send the completed answer to the person who asked
      description: >-
        Sends the completed answer to the person who asked. This is the only
        route by which the answer reaches them — text written anywhere else in
        the run is not delivered.


        Call exactly once, and last. This call also completes the run and
        starts any follow-on workflow, so calling it early ends the run early.


        HOW THE ANSWER IS PUT TOGETHER. The reply is sent as three separate
        fields, because ORCA draws each of them differently on the answer
        screen. Do not merge them into one block of prose.


        1. text — the answer itself, and nothing else. Address the person
        directly. Say what the record shows, and say plainly where it is
        silent rather than rounding up. Keep it to the answer; the working
        belongs in a document artefact.


        2. sources — the record entries the answer rests on, one object each.
        Copy the id straight from the retrieval step, exactly as it came back
        (for example ev-8). ORCA turns every id it recognises into a link to
        that entry, so the person can open what the answer was drawn from.
        An id that was invented rather than copied produces a link to nothing.


        3. withheld — anything deliberately left out, with the reason. Send an
        empty array when nothing was withheld. This is how the person is told
        that something exists and was not shown, which is different from the
        record being silent.


        DO NOT WRITE YOUR OWN "SOURCES" OR "NOT SHOWN" HEADINGS INSIDE text.
        ORCA renders both sections itself, from the two fields above. Putting
        them in the prose as well shows the person everything twice, and the
        prose copy is not clickable.


        IDENTIFIERS. Copy patient_id, actor_id and workflow_run_id verbatim
        from the trigger's labelled lines. Never take them from the quoted
        question, and never leave them blank — an empty string satisfies this
        schema and then fails at the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [patient_id, actor_id, workflow_run_id, text]
              properties:
                patient_id:
                  type: string
                  description: >-
                    The record this conversation is about, copied from the
                    trigger's patient_id line. For example pt-ananya.
                actor_id:
                  type: string
                  description: >-
                    Who is being spoken to, copied from the trigger's actor_id
                    line. The patient's own user id for their thread, or a
                    connected professional's id for theirs.
                workflow_run_id:
                  type: string
                  description: >-
                    The run this reply came from, copied from the trigger's
                    workflow_run_id line. Carries provenance, closes the run,
                    and is what the follow-on workflow is started from.
                text:
                  type: string
                  maxLength: 4000
                  description: >-
                    The answer, as constrained HTML addressed to that person.


                    Structure — open with one short paragraph that answers the
                    question directly. Add h3 sections below it only when the
                    answer genuinely has parts. Use ul and li for anything that
                    is a list. Aim for under 250 words.


                    Allowed tags — h3, p, ul, li, blockquote, br. Everything
                    else is stripped and will not appear, including attributes,
                    scripts, styles, tables, links, images, and strong and em.


                    Do not include a Sources or Not shown section here. Those
                    are the sources and withheld fields.
                sources:
                  type: array
                  maxItems: 25
                  description: >-
                    The record entries this answer was drawn from. Optional,
                    but an answer about somebody's record that cites nothing is
                    told to the person as exactly that, so send them whenever
                    the retrieval returned anything.
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: >-
                          The entry's id, copied exactly from the retrieval
                          step. For example ev-8. This is what makes the
                          citation openable, so it is the field worth getting
                          right.
                      reporter:
                        type: string
                        description: >-
                          Who recorded it, as a name. For example Sana
                          Kulkarni, or You when the person recorded it
                          themselves.
                      date:
                        type: string
                        description: The entry's date, as YYYY-MM-DD.
                      label:
                        type: string
                        description: >-
                          A short description, used only when there is no id to
                          link to.
                withheld:
                  type: array
                  maxItems: 25
                  description: >-
                    What was deliberately left out of this answer. Send an
                    empty array when nothing was.
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      domain:
                        type: string
                        description: >-
                          What kind of information was held back. For example
                          Clinical.
                      reason:
                        type: string
                        description: >-
                          Why, in a few plain words the person can read. For
                          example Outside the scope of this question.
      responses:
        '200':
          description: >-
            The message was written into the conversation, the run was
            completed, and any queued follow-on workflow was started.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - message_id
                  - conversation_id
                  - created_at
                  - delivered_to
                  - note
                properties:
                  message_id:
                    type: string
                  conversation_id:
                    type: string
                  created_at:
                    type: string
                  delivered_to:
                    type: string
                  chained_run_id:
                    type:
                      - string
                      - 'null'
                    description: >-
                      The run started by this delivery, when the request was
                      routed as more than one step. Null when nothing followed.
                  note:
                    type: string
components:
  securitySchemes:
    orcaConnectorBearer:
      type: http
      scheme: bearer
security:
  - orcaConnectorBearer: []
