openapi: 3.1.0
info:
  title: ORCA Workflow State
  version: 1.0.0
servers:
  - url: https://zievqdkhxenenpyxqese.supabase.co
paths:
  /functions/v1/workflow-state:
    post:
      operationId: advanceWorkflowState
      summary: Read or advance the state of a workflow run
      description: >-
        Creates a run when none is supplied, otherwise records the step that has
        just completed and the one now in progress. Reports whether the run is
        blocked on a named human, which no agent may bypass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose:
                  type: string
                  enum: [route, sufficiency, define_goal, governance_route, execution_status, close]
                  description: Which routing decision this step is making.
                patient_id:
                  type: string
                  description: Patient the run belongs to. Required when creating a run.
                workflow_run_id:
                  type: string
                  description: Existing run to advance. Omit to start a new run.
                workflow_type:
                  type: string
                  description: Human-readable run type, for example Workplace accommodation.
                stakeholder:
                  type: string
                  description: Who this run is being carried out for.
                current_step:
                  type: string
                  description: The step now in progress.
                status:
                  type: string
                  enum:
                    - Draft
                    - Active
                    - Awaiting information
                    - Awaiting approval
                    - Awaiting professional review
                    - Awaiting stakeholder
                    - In progress
                    - Completed
                    - Requires adaptation
                    - Escalated
                    - Blocked
                    - Cancelled
                  description: Status to set. Ignored when closing.
                waiting_for:
                  type: string
                  description: The named person or organisation the run is waiting on.
                note:
                  type: string
                  description: Short detail shown against the step in the interface.
                closure_reason:
                  type: string
                  description: Why the run closed. Used when purpose is close.
                goal:
                  type: object
                  additionalProperties: true
                  description: Goal brief to store against the run when purpose is define_goal.
      responses:
        '200':
          description: Current workflow state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workflow_run_id, type, status, current_step, blocked_on_human, next_action, steps]
                properties:
                  workflow_run_id: { type: string }
                  patient_id: { type: [string, 'null'] }
                  type: { type: string }
                  status: { type: string }
                  current_step: { type: string }
                  waiting_for: { type: [string, 'null'] }
                  blocked_on_human: { type: boolean }
                  next_action: { type: string }
                  steps:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [label, state]
                      properties:
                        label: { type: string }
                        state:
                          type: string
                          enum: [done, current, todo]
                        detail: { type: [string, 'null'] }
                  updated_at: { type: string }
components:
  securitySchemes:
    orcaConnectorBearer:
      type: http
      scheme: bearer
security:
  - orcaConnectorBearer: []
