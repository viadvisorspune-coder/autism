openapi: 3.1.0
info:
  title: ORCA audit and provenance
  version: 1.0.0
servers:
  - url: https://orca.example.com
paths:
  /api/yoxa/audit:
    post:
      operationId: recordAuditEvents
      summary: Append audit events for a workflow run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workflow_run_id, patient_id, events]
              properties:
                workflow_run_id:
                  type: string
                  format: uuid
                patient_id:
                  type: string
                  format: uuid
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: Events to append. The trail has no update or delete path.
                  items:
                    type: object
                    additionalProperties: false
                    required: [action]
                    properties:
                      action:
                        type: string
                        maxLength: 120
                        description: Verb, e.g. 'record.read', 'consent.granted', 'disclosure.sent'.
                      resource:
                        type: string
                        maxLength: 200
                      ai_inferred:
                        type: boolean
                        description: True when the event describes a model inference, not a fact.
                      detail:
                        type: object
                        additionalProperties: true
      responses:
        '200':
          description: How many events were appended.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workflow_run_id, recorded_count]
                properties:
                  workflow_run_id:
                    type: string
                    format: uuid
                  recorded_count:
                    type: integer
components:
  securitySchemes:
    orcaConnectorBearer:
      type: http
      scheme: bearer
security:
  - orcaConnectorBearer: []
