openapi: 3.1.0
info:
  title: ORCA longitudinal record retrieval
  version: 1.0.0
servers:
  - url: https://orca.example.com
paths:
  /api/yoxa/records/search:
    post:
      operationId: searchPatientRecords
      summary: Retrieve authorised records from a patient's longitudinal record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [patient_id, actor_user_id, purpose, categories]
              properties:
                patient_id:
                  type: string
                  format: uuid
                actor_user_id:
                  type: string
                  format: uuid
                  description: Whose authority the retrieval runs under.
                purpose:
                  type: string
                  maxLength: 200
                  description: >-
                    Matched against the patient's consent purposes. Access is
                    decided before any row is read.
                categories:
                  type: array
                  minItems: 1
                  description: >-
                    Categories wanted. Unpermitted ones are dropped rather than
                    failing the request, so ask for what the task needs.
                  items:
                    type: string
                    enum: [personal, functional, clinical, support, preference, contextual, outcome, administrative]
                occurred_since:
                  type: string
                  format: date-time
                occurred_until:
                  type: string
                  format: date-time
                limit:
                  type: integer
                  minimum: 1
                  maximum: 200
                  description: Maximum records to return. Defaults to 50.
                workflow_run_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: >-
            The authorised records. A refusal is also a 200, with decision
            'deny', an empty records array and total 0.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [decision, reason, permitted_categories, total, records]
                properties:
                  decision:
                    type: string
                    enum: [allow, allow_with_scope, deny]
                  reason:
                    type: string
                  permitted_categories:
                    type: array
                    items:
                      type: string
                      enum: [personal, functional, clinical, support, preference, contextual, outcome, administrative]
                  total:
                    type: integer
                  records:
                    type: array
                    description: Current versions only; superseded rows are not returned.
                    items:
                      type: object
                      additionalProperties: false
                      required: [record_id, category, kind, body, structured, provenance, evidence_status, uncertainty_note, visibility, occurred_at, recorded_at, version]
                      properties:
                        record_id:
                          type: string
                          format: uuid
                        category:
                          type: string
                          enum: [personal, functional, clinical, support, preference, contextual, outcome, administrative]
                        kind:
                          type: string
                        body:
                          type: string
                        structured:
                          type: [object, 'null']
                          additionalProperties: true
                        provenance:
                          type: string
                          enum: [patient_reported, clinician_documented, external_document, system_generated, ai_inferred]
                        evidence_status:
                          type: string
                          enum: [unvalidated, partially_structured, professionally_documented, contradicted, superseded]
                        uncertainty_note:
                          type: [string, 'null']
                        visibility:
                          type: string
                          enum: [private, care_team, explicitly_shared]
                        occurred_at:
                          type: string
                          format: date-time
                        recorded_at:
                          type: string
                          format: date-time
                        version:
                          type: integer
components:
  securitySchemes:
    orcaConnectorBearer:
      type: http
      scheme: bearer
security:
  - orcaConnectorBearer: []
