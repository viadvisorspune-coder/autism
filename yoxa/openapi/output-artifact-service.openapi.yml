openapi: 3.1.0
info:
  title: ORCA Output Artefact Delivery
  version: 1.0.0
servers:
  - url: https://zievqdkhxenenpyxqese.supabase.co
paths:
  /functions/v1/output-artifact:
    post:
      operationId: deliverGeneratedArtifact
      summary: Receive an approved artefact and record it on the patient's file
      description: >-
        Stores one generated document against the patient's record.


        One document per request, at the end. Not one per stage — sections
        accumulate into the same file.


        Never call this for a question. If the lane is answer, reply in words
        instead and do not call this at all.


        Attach the workflow's generated output files to this connector under
        Attach output files. The endpoint also accepts a plain JSON request
        with no files, which is what the connection check sends.


        ACCEPTED FILE TYPES. application/pdf, text/html, text/plain,
        image/png, image/jpeg. Anything else is refused with 415 and the
        document is not recorded, so a run that produced a file in another
        format has produced nothing.


        THIS DOES NOT CLOSE THE RUN. It records a document and returns. The
        run is completed by whatever comes after — the approval gate, or the
        reply that tells the person the draft exists. A workflow whose only
        output is this call leaves its run open with a file nobody was told
        about.


        WHO CAN OPEN IT. Access defaults to the patient alone. A handover
        drafted for an occupational therapist is invisible to that therapist
        unless their role is named in access. Name only the roles that need
        it; this is a disclosure, not a filing decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [patient_id, title]
              properties:
                patient_id:
                  type: string
                  description: Patient whose record receives the artefact.
                title:
                  type: string
                  description: Title shown in the patient's document library.
                category:
                  type: string
                  enum: [Clinical, Therapy, OT, Employment, University, Statutory, Personal]
                  description: Which shelf of the library it belongs on. Defaults to Personal.
                recipient:
                  type: string
                  description: Who the artefact was prepared for. Recorded, not acted on.
                summary:
                  type: string
                  description: One-line description, shown to the patient before they accept it.
                access:
                  type: array
                  description: >-
                    Roles permitted to open it. Defaults to the patient alone,
                    so a document drafted for somebody else is invisible to
                    them until their role is listed here. Send role names, not
                    user ids — u-sana is not a role, ot is. Anything outside
                    the list is ignored and named back to you in note.
                  items:
                    type: string
                    enum:
                      - patient
                      - psychologist
                      - psychiatrist
                      - therapist
                      - ot
                      - gp
                      - clinic
                      - employer
                      - university
                      - trusted
                      - admin
                section:
                  type: string
                  description: >-
                    What part of the work this contribution is — for example
                    "What was tried", "Evidence", "Recommendation". Calls
                    sharing a workflow_run_id build ONE document, and this is
                    the heading each part appears under. Omit it and the parts
                    are numbered instead, which is worse to read.
                workflow_run_id:
                  type: string
                  description: >-
                    The run this document came from, copied verbatim from the
                    trigger's workflow_run_id line. Two things depend on it:
                    the document is attached to the conversation that asked for
                    it, so the person sees it beside their request rather than
                    only in the library; and calls sharing this id build ONE
                    document rather than several. Omit it and you get a loose
                    file nobody asked for.
      responses:
        '200':
          description: Artefact recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [document_id, patient_id, title, status, received_file_count, stored_files, note]
                properties:
                  document_id: { type: string }
                  patient_id: { type: string }
                  title: { type: string }
                  status: { type: string }
                  received_file_count: { type: integer }
                  stored_files:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [file_name, content_type, size_bytes, storage_path]
                      properties:
                        file_name: { type: string }
                        content_type: { type: string }
                        size_bytes: { type: integer }
                        storage_path: { type: string }
                  note: { type: string }
components:
  securitySchemes:
    orcaConnectorBearer:
      type: http
      scheme: bearer
security:
  - orcaConnectorBearer: []
