openapi: 3.1.0
info:
  title: ORCA Workflow Routing
  version: 1.0.0
servers:
- url: https://zievqdkhxenenpyxqese.supabase.co
paths:
  /functions/v1/workflow-state:
    post:
      operationId: routeWorkflow
      summary: Decide which steps this request needs, and record the decision
      description: >-
        Call this once, first, before any other step runs. Send the lane and the
        list of steps this request actually needs. The plan is written into the
        run, returned to every later step in `steps`, and shown to the person
        waiting in their own interface.


        A step that is not on the plan is not needed for this request. An agent
        whose step is absent should say so in one line and stop rather than
        calling any tool.


        Called without a plan this only reads the current state, which is what
        later steps do when they want to know what was decided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - purpose
              - patient_id
              properties:
                purpose:
                  type: string
                  enum:
                  - route
                  description: 'Fixed for this connector. Send exactly: route'
                lane:
                  type: string
                  enum:
                  - answer
                  - make
                  - send
                  description: >-
                    Which lane this request is in. Copy it from the LANE line at
                    the top of the trigger text — the application has already
                    decided it. answer means reply in words and produce nothing.
                    make means build a document that stays inside ORCA. send
                    means it also goes to somebody outside, which needs an
                    approval.
                plan:
                  type: array
                  description: >-
                    The steps this request needs, in order, named exactly as
                    they appear in the workflow. Fewer is the correct answer,
                    not a shortcut. Omit to read the existing plan instead of
                    setting one.
                  items:
                    type: string
                patient_id:
                  type: string
                  description: 'Patient the run belongs to, for example pt-ananya. Required: a run is
                    always about one person.'
                workflow_run_id:
                  type: string
                  description: Existing run to advance. Omit to start a new run.
                workflow_type:
                  type: string
                  description: Human-readable run type, for example Workplace accommodation.
                stakeholder:
                  type: string
                  description: Who this run is being carried out for.
                current_step:
                  type: string
                  description: The step now in progress.
                status:
                  type: string
                  enum:
                  - Draft
                  - Active
                  - Awaiting information
                  - Awaiting approval
                  - Awaiting professional review
                  - Awaiting stakeholder
                  - In progress
                  - Completed
                  - Requires adaptation
                  - Escalated
                  - Blocked
                  - Cancelled
                  description: Status to set. Ignored when closing.
                waiting_for:
                  type: string
                  description: The named person or organisation the run is waiting on.
                note:
                  type: string
                  description: Short detail shown against the step in the interface.
                closure_reason:
                  type: string
                  description: Why the run closed. Used when purpose is close.
                goal:
                  type: object
                  additionalProperties: false
                  description: Goal brief to store against the run when purpose is define_goal.
                  properties:
                    current_need:
                      type: string
                      description: What the person needs right now, in their own terms.
                    desired_outcome:
                      type: string
                      description: What a good result looks like.
                    stakeholders:
                      type: array
                      description: Roles involved in reaching the outcome.
                      items:
                        type: string
                    constraints:
                      type: array
                      description: Limits the plan must respect, including stated preferences.
                      items:
                        type: string
                    required_output:
                      type: string
                      description: The artefact or action the goal calls for, if any.
                    goal_statement:
                      type: string
                      description: The goal in one sentence.
                    success_criteria:
                      type: array
                      description: Observable criteria. Avoid clinical targets.
                      items:
                        type: string
      responses:
        '200':
          description: Current workflow state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - workflow_run_id
                - type
                - status
                - current_step
                - blocked_on_human
                - next_action
                - steps
                properties:
                  workflow_run_id:
                    type: string
                  patient_id:
                    type:
                    - string
                    - 'null'
                  type:
                    type: string
                  status:
                    type: string
                  current_step:
                    type: string
                  waiting_for:
                    type:
                    - string
                    - 'null'
                  blocked_on_human:
                    type: boolean
                  next_action:
                    type: string
                  steps:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - label
                      - state
                      properties:
                        label:
                          type: string
                        state:
                          type: string
                          enum:
                          - done
                          - current
                          - todo
                        detail:
                          type:
                          - string
                          - 'null'
                          description: Short note shown against this step, if any.
                  updated_at:
                    type: string
components:
  securitySchemes:
    orcaConnectorBearer:
      type: http
      scheme: bearer
security:
- orcaConnectorBearer: []
