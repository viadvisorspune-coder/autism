openapi: 3.1.0
info:
  title: ORCA generated artifact delivery
  version: 1.0.0
servers:
  - url: https://orca.example.com
paths:
  /api/yoxa/artifacts:
    post:
      operationId: deliverGeneratedArtifact
      summary: Receive a document generated by a workflow output tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [patient_id, workflow_run_id, title]
              properties:
                patient_id:
                  type: string
                  format: uuid
                workflow_run_id:
                  type: string
                  format: uuid
                title:
                  type: string
                  maxLength: 300
                  description: What the document is, shown to the person it concerns.
                recipient_user_id:
                  type: string
                  format: uuid
                  description: Who the document was written for. Omit for the patient themselves.
                approval_id:
                  type: string
                  format: uuid
                  description: The approval that authorised delivering this to its recipient.
      responses:
        '200':
          description: >-
            What was received. An API Connection Check carries no files and
            returns received_count 0 with an empty artifacts array.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workflow_run_id, title, received_count, artifacts]
                properties:
                  workflow_run_id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  received_count:
                    type: integer
                  artifacts:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [artifact_id, filename]
                      properties:
                        artifact_id:
                          type: string
                          format: uuid
                        filename:
                          type: string
components:
  securitySchemes:
    orcaConnectorBearer:
      type: http
      scheme: bearer
security:
  - orcaConnectorBearer: []
