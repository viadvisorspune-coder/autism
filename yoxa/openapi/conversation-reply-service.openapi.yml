openapi: 3.1.0
info:
  title: ORCA Conversation Reply
  version: 1.0.0
  description: >-
    Lets a workflow answer in words, in the conversation the person is already
    reading. Everything else a run can do to this record is structured — state
    updates, reviews, clarifications, documents. This is the one operation that
    simply says something.
servers:
  - url: https://zievqdkhxenenpyxqese.supabase.co
paths:
  /functions/v1/conversation-reply:
    post:
      operationId: replyInConversation
      summary: Write an ORCA message into a person's conversation
      description: >-
        Appends an ORCA-authored message to the thread between this patient and
        this actor, creating the thread if the actor is the patient or has a
        live connection to the record. The message appears in their interface
        immediately.


        Saying something is not doing something. This writes text and nothing
        else: it does not decide, share, or alter the record, and it must not be
        used to convey an outcome that has not been through the approval it
        needs. Where an action is required, call the connector for that action —
        each stops for a person.


        Every message is stored with the run that produced it, so any line in a
        conversation can be traced back to the reasoning behind it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [patient_id, actor_id, text]
              properties:
                patient_id:
                  type: string
                  description: The record this conversation is about.
                actor_id:
                  type: string
                  description: >-
                    Who is being spoken to. The patient's own user id for their
                    thread, or a connected professional's id for theirs.
                text:
                  type: string
                  maxLength: 4000
                  description: >-
                    The message, in plain language addressed to that person.
                    Name what it is drawn from, and say where you are uncertain
                    rather than rounding up. Keep it to the answer; put the
                    working into a document artefact.
                workflow_run_id:
                  type: string
                  description: The run this reply came from, kept for provenance.
      responses:
        '200':
          description: The message was written into the conversation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - message_id
                  - conversation_id
                  - created_at
                  - delivered_to
                  - note
                properties:
                  message_id:
                    type: string
                  conversation_id:
                    type: string
                  created_at:
                    type: string
                  delivered_to:
                    type: string
                  note:
                    type: string
components:
  securitySchemes:
    orcaConnectorBearer:
      type: http
      scheme: bearer
security:
  - orcaConnectorBearer: []
