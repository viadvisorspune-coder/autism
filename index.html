    <!--
      Sen, in one family across the whole interface, at three weights.

      One family, and weight does the work a second family would otherwise do:
      400 carries a paragraph, 500 a label, 700 titles a card and holds a
      display line.

      A geometric sans with a tall x-height and wide, open apertures — the c,
      the e and the s stay open rather than curling closed, which is what keeps
      a 13px row of dates and names readable at a glance. The single-storey a
      is the one thing to be aware of: it is a genuine departure from the
      double-storey forms the legibility guidance prefers, and it is the reason
      body text here stays at 18px rather than dropping to a conventional 16.

      Only the three weights actually used are requested. Sen ships 400 to 800;
      loading the range and using three of it is most of a font download nobody
      reads.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sen:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
