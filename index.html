  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      name="description"
      content="ORCA — one longitudinal record, role-specific views, and a shared agentic workflow layer."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo, in one family across the whole interface.

      The reference sets everything in a single heavy grotesque and lets weight
      do the work that a second family would otherwise do. Archivo is the
      closest well-made match available on Google Fonts: a grotesque drawn for
      headlines, tight enough at 800 to hold a display line, and readable at
      400 in a paragraph. Two families were being loaded before, one of which
      nothing used.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>ORCA</title>
  </head>

  </body>
