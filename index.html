    <!--
      Ubuntu, in one family across the whole interface, at four weights.

      One family, and weight does the work a second family would otherwise do:
      400 carries a paragraph, 500 a label, 700 titles a card and holds a
      display line.

      It suits what this interface is for. Ubuntu is a humanist sans with open
      apertures and unusually distinct letterforms at small sizes — the l, the
      1 and the I do not collapse into one another, and the a and g are
      double-storey — which is what the legibility guidance asks for and what a
      screen full of dates, names and short labels needs. Its slightly narrow
      set width also buys back some of the room the large type scale spends.

      Only the four weights that are actually used are requested. A family
      loaded at seven weights and used at three is three quarters of a font
      download nobody reads.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>ORCA</title>
  </head>
