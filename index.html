    <!--
      Hanken Grotesk, in one family across the whole interface, at four weights.

      WHY THIS FACE AND NOT THE ONE IN THE REFERENCE. The interface it was drawn
      from is set in Aeonik, which is a licensed face from CoType and cannot be
      served from a public font host — there is no version of it we can put on
      this page without buying a webfont licence. Hanken Grotesk is the closest
      thing that is free to serve: the same geometric skeleton, the same low
      stroke contrast, the same wide circular bowls on the o, the c and the
      digits, and the same flat horizontal terminals. Set beside each other at
      display size the difference is in the leg of the R and the tail of the y,
      and nowhere else that shows.

      It is also a straight improvement on Sen, which this replaces, for the
      reason Sen's own note flagged: Sen's single-storey a is a departure from
      the double-storey forms the legibility guidance asks for, and Hanken
      Grotesk draws a conventional double-storey a. That was the one thing
      holding body text at 18px rather than a conventional 16.

      One family, and weight does the work a second family would otherwise do:
      400 carries a paragraph, 500 a label, 600 a section heading, 700 titles
      and display figures. Only those four are requested.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
