    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo, in one family across the whole interface, at three weights.

      One family and let weight do the work a second family would otherwise do.
      Archivo is a geometric grotesque with wide apertures and high legibility
      at large sizes, which is what the reference is doing and what the autism
      guidance asks for: 400 carries a paragraph, 600 titles a card, 800 holds
      a 56px display line.

      Not the Narrow cut. Condensed faces buy horizontal space by closing the
      apertures, and this interface has no shortage of horizontal space — the
      column is capped at 720px on purpose. Legibility is the thing being
      bought here, so the regular width is the right cut.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ORCA</title>
  </head>
