# Yoxa presents its own bearer token, not a Supabase JWT, so Supabase's gateway
# check must be off and each function verifies YOXA_CONNECTOR_TOKEN itself.
[functions.identity-access]
verify_jwt = false

[functions.knowledge-evidence]
verify_jwt = false

[functions.workflow-state]
verify_jwt = false

[functions.safety-authority-review]
verify_jwt = false

[functions.audit-provenance]
verify_jwt = false

[functions.stakeholder-communication]
verify_jwt = false

# The agent answering in words. Bearer-guarded like every other connector;
# verify_jwt stays off because Yoxa presents the connector token, not a JWT.
[functions.conversation-reply]
verify_jwt = false

[functions.output-artifact]
verify_jwt = false

[functions.governance-ledger]
verify_jwt = false

# ORCA's own read path. verify_jwt is off only because the interface has no
# sign-in yet; the function enforces role scope itself and says so in its own
# header comment. Turn this on the moment Supabase Auth lands.
[functions.app-read]
verify_jwt = false

[functions.app-write]
verify_jwt = false

# Yoxa posts signed HITL events here; the function verifies the signature
# itself, so the gateway JWT check must be off.
[functions.hitl-receiver]
verify_jwt = false

# Called by ORCA's own frontend. There is no sign-in yet, so the gateway check
# is off and the function resolves the actor itself — from a real session when
# one exists, or from an asserted actor_id when ORCA_DEMO_MODE is set. Scope is
# enforced either way. Turn verify_jwt back on and unset ORCA_DEMO_MODE the day
# Supabase Auth lands; neither function's logic changes.
[functions.workflow-trigger]
verify_jwt = false

[functions.hitl-respond]
verify_jwt = false
